[package]
name = "void-bootstrap-node"
version = "0.1.0"
edition = "2021"
description = "Bootstrap / seed node for VOID P2P messenger DHT"

[dependencies]
libp2p = { version = "0.56", features = ["tcp", "noise", "yamux", "tokio", "kad", "ping", "macros"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
strip = true
lto = "thin"
