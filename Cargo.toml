[package]
name = "void-bootstrap-node"
version = "0.3.0"
edition = "2021"
description = "Bootstrap / seed / relay node for VOID P2P messenger DHT + encrypted DNS-Seed exchange"

[dependencies]
libp2p = { version = "0.56", features = [
    "tcp",
    "quic",
    "dns",
    "noise",
    "yamux",
    "tokio",
    "kad",
    "ping",
    "identify",
    "relay",
    "autonat",
    "request-response",
    "json",
    "macros",
    "ed25519",
] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "net", "io-util", "sync", "time", "fs"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- serialization ---
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bincode = "1.3"

# --- crypto: Noise-XX-like handshake for the seed protocol ---
x25519-dalek = { version = "2", features = ["static_secrets"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
chacha20poly1305 = "0.10"
sha2 = "0.10"
hkdf = "0.12"
rand = "0.8"
zeroize = { version = "1.7", features = ["derive"] }

# --- utils ---
anyhow = "1"

[profile.release]
strip = true
lto = "thin"
